apiVersion: v1
kind: Service
metadata:
  name: temp-converter
spec:
  type: NodePort
  selector:
    app: temp-converter             # every pod with this label receives traffic
  ports:
    - port: 80                      # the Service's port inside the cluster
      targetPort: 3000              # the container's port
      nodePort: 30080               # reachable on every node at this port
